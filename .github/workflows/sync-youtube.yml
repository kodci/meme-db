name: YouTube playlist eşitle

on:
  schedule:
    - cron: '17 3 * * *'   # her gün 03:17 UTC
  workflow_dispatch:       # Actions sekmesinden elle çalıştır
  push:
    paths:
      - playlists.txt

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Playlist'leri eşitle
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/sync_youtube.py

      - name: Değişiklik varsa commit'le
        run: |
          if git diff --quiet -- index.json; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "sync: YouTube playlist güncellendi"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
